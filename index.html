<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        /* This is CSS: It styles the look of your website */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
        }
        h1 { color: #007bff; margin-bottom: 10px; }
        p { color: #555; line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <!-- This is HTML: It adds the actual text content -->
    <div class="card">
        <h1>Welcome to My Website!</h1>
        <p>Hello! I am learning web development. I built this clean website using simple HTML and CSS hosted entirely on GitHub Pages.</p>
        <a href="mailto:your-email@example.com" class="btn">Contact Me</a>
    </div>

</body>
</html>
